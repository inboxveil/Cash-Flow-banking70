<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CashflowBank - Everything SVG + Firebase + Tawk</title><script src="https://cdn.tailwindcss.com"></script><script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script><style>*{font-family:Inter,system-ui,sans-serif}</style></head><body style="background:#f1f4f8">

<div id="sec-transfer" class="sec hidden"><div class="bg-white rounded-2xl p-5 shadow"><h3 class="font-bold flex items-center gap-2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Send Money - 1M Limit, PENDING until Approved</h3><div class="mt-3 p-3 bg-blue-50 border rounded-xl text-[11px] flex justify-between"><span>Used: <b id="transferUsed">$0</b></span><span>Remain: <b id="transferRemain" class="text-green-700">$1,000,000</b></span></div><input id="tAmount" type="number" placeholder="Amount e.g 50000" class="w-full border rounded-xl px-4 h-11 mt-3 text-sm"/><input id="tTo" placeholder="To Account (10 digits only)" maxlength="10" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm font-mono"/><input id="tToName" placeholder="Recipient Full Name" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><input id="tPin" type="password" placeholder="Your 4-digit PIN" maxlength="4" class="w-full border-2 border-amber-300 bg-amber-50 rounded-xl px-4 h-11 mt-2 text-sm font-bold"/><button onclick="doTransfer()" class="w-full bg-[#0a2540] text-white h-11 rounded-xl mt-3 font-bold text-sm flex items-center justify-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Request Transfer (PENDING)</button><div id="tMsg" class="text-xs mt-3 p-2 rounded-xl"></div></div></div>

<div class="bg-white rounded-2xl p-3 shadow mt-4 flex gap-2"><button onclick="goMenu('dashboard')" class="flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold">Dashboard</button><button onclick="goMenu('transfer')" class="flex-1 border h-10 rounded-xl text-sm">Transfer</button><button onclick="goMenu('history')" class="flex-1 border h-10 rounded-xl text-sm">History</button></div>

</button></div><div id="uMsg" class="text-xs mt-2"></div></div>

<script type="module">
import { initializeApp } from "firebase/app"; import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, updateDoc } from "firebase/firestore";
const firebaseConfig = { apiKey: "AIzaSyDuYtiY8VISaRA0dHvxgzVGPOcI_DilAH0", authDomain: "cash-flow-banking70.firebaseapp.com", projectId: "cash-flow-banking70", storageBucket: "cash-flow-banking70.firebasestorage.app", messagingSenderId: "1066612075328", appId: "1:1066612075328:web:3472b082cc86aa7d4428a5" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
function genAcctNum(){return Math.floor(1000000000+Math.random()*9000000000).toString();}
window.switchTab=(t)=>{document.getElementById('formCreate').classList.toggle('hidden', t!=='create'); document.getElementById('formLogin').classList.toggle('hidden', t!=='login'); document.getElementById('tabCreate').className=t==='create'?'flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold':'flex-1 border h-10 rounded-xl text-sm'; document.getElementById('tabLogin').className=t==='login'?'flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold':'flex-1 border h-10 rounded-xl text-sm';}
window.goMenu=(id)=>{document.querySelectorAll('.sec').forEach(e=>e.classList.add('hidden')); document.getElementById('sec-'+id)?.classList.remove('hidden');}
window.register=async()=>{const name=document.getElementById('rName').value.trim(), email=document.getElementById('rEmail').value.toLowerCase().trim(), pass=document.getElementById('rPass').value, pin=document.getElementById('rPin').value, type=document.getElementById('rType').value, country=document.getElementById('rCountry').value; if(!name||!email||!pass||!pin) return alert('Fill all'); if(pin.length!==4) return alert('4-digit PIN'); let acct=genAcctNum(); let snap=await getDoc(doc(db,'users',acct)); while(snap.exists()){acct=genAcctNum(); snap=await getDoc(doc(db,'users',acct));} const data={accountNumber:acct,name,email,pass,pin,type,country,status:'PENDING',checking:0,savings:0,dailyLimit:1000000,usedToday:0,lastReset:Date.now(),creditScore:Math.floor(680+Math.random()*120),transactions:[],createdAt:Date.now()}; await setDoc(doc(db,'users',acct), data); let res=document.getElementById('createResult'); res.classList.remove('hidden'); res.innerHTML=`✅ Account Created - PENDING Approval<br><br><b class="font-mono text-[22px] tracking-widest">${acct}</b><br><span class="text-[11px]">10-digit number only - Save am!</span><br><br><button onclick="switchTab('login'); document.getElementById('lAcct').value='${acct}'" class="bg-black text-white px-4 py-2 rounded-full text-xs">Go to Login →</button>`; document.getElementById('uMsg').innerHTML='Go to admin.html and approve with PIN admin123';}
window.login=async()=>{let acct=document.getElementById('lAcct').value.replace(/\D/g,'').trim(), pass=document.getElementById('lPass').value; if(acct.length!==10) return alert('Account number must be 10 digits'); let snap=await getDoc(doc(db,'users',acct)); if(!snap.exists()) return document.getElementById('uMsg').innerHTML='<span class=text-red-600>No account found</span>'; let u=snap.data(); if(u.pass!==pass) return document.getElementById('uMsg').innerHTML='<span class=text-red-600>Wrong password</span>'; if(u.status!=='APPROVED') return document.getElementById('uMsg').innerHTML=`<span class=text-red-600>Account status: ${u.status}<br>Admin never approve yet - Go to admin.html</span>`; let today=new Date().toDateString(); if(new Date(u.lastReset||Date.now()).toDateString()!==today){await updateDoc(doc(db,'users',acct), {usedToday:0,lastReset:Date.now()}); u.usedToday=0;} localStorage.setItem('cfb_sess',acct); afterLogin(u);}
window.afterLogin=async(u)=>{document.getElementById('authBox').classList.add('hidden'); goMenu('dashboard'); document.getElementById('dashAcct').innerText=u.accountNumber; document.getElementById('dashBal').innerText='$'+Number(u.checking).toLocaleString()+'.00'; document.getElementById('dashCredit').innerText=u.creditScore; document.getElementById('dashLimit').innerText='$'+(u.dailyLimit||1000000).toLocaleString(); document.getElementById('dashUsed').innerText='$'+(u.usedToday||0).toLocaleString(); let remain=(u.dailyLimit||1000000)-(u.usedToday||0); if(remain<0) remain=0; document.getElementById('dashRemain').innerText='$'+remain.toLocaleString(); document.getElementById('transferUsed').innerText='$'+(u.usedToday||0).toLocaleString(); document.getElementById('transferRemain').innerText='$'+remain.toLocaleString(); let q=query(collection(db,'transfers'), where('from','==',u.accountNumber)); let s=await getDocs(q); let transfers=[]; s.forEach(d=>transfers.push(d.data())); let pend=transfers.filter(t=>t.status==='PENDING'); document.getElementById('pendList').innerHTML=pend.reverse().map(t=>`<div class="py-3 flex justify-between items-center"><div><div class="font-bold">$${Number(t.amount).toLocaleString()}.00 to <span class="font-mono">${t.to}</span></div><div class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full inline-block font-bold mt-1">⏳ PENDING - ${t.ref}</div><div class="text-[10px] text-gray-400 mt-1">${t.date}</div></div><button onclick="openReceipt('${t.id}')" class="text-[10px] bg-gray-100 px-3 py-1.5 rounded-full underline">View SVG Receipt</button></div>`).join('')||'<div class="text-gray-400 py-3 text-center text-xs">No pending transfers ✓</div>'; document.getElementById('txList').innerHTML=(u.transactions||[]).slice().reverse().map(t=>`<div class="py-3 flex justify-between items-center"><div><div class="font-bold flex items-center gap-2">${t.type}<span class="text-[10px] ${t.status==='PENDING'?'bg-amber-100 text-amber-700':t.status==='SUCCESS'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} px-2 py-0.5 rounded-full">${t.status||'SUCCESS'}</span></div><div class="text-[10px] text-gray-400">${t.note} • ${t.date} • Ref: ${t.ref||''}</div></div><div class="text-right"><b class="${t.amount>0?'text-green-600':'text-red-600'}">${t.amount>0?'+':''}$${Number(t.amount).toLocaleString()}</b><br><button onclick="openReceipt('${t.transferId||''}')" class="text-[10px] underline text-blue-600 mt-1">SVG Receipt</button></div></div>`).join('')||'<div class="text-gray-400 py-3 text-center">No history yet</div>'; window.currentUser=u;}
window.logout=()=>{localStorage.removeItem('cfb_sess'); document.getElementById('authBox').classList.remove('hidden'); goMenu('dashboard');}
window.doTransfer=async()=>{const amt=parseFloat(document.getElementById('tAmount').value), to=document.getElementById('tTo').value.replace(/\D/g,'').trim(), toName=document.getElementById('tToName').value.trim(), pin=document.getElementById('tPin').value; let msg=document.getElementById('tMsg'); if(!amt||!to) return msg.innerHTML='<span class=text-red-600>Fill all fields</span>'; if(to.length!==10) return msg.innerHTML='<span class=text-red-600>To account must be 10 digits (numbers only)</span>'; if(pin!==window.currentUser.pin) return msg.innerHTML='<span class=text-red-600>Wrong PIN</span>'; const LIMIT=window.currentUser.dailyLimit||1000000; const used=window.currentUser.usedToday||0; const remain=LIMIT-used; if(used>=LIMIT){msg.className='text-xs mt-3 p-3 rounded-xl bg-red-50 border border-red-200'; return msg.innerHTML=`⛔ <b>You have passed your daily limit of $${LIMIT.toLocaleString()}</b><br>Remaining: $0<br>Used: $${used.toLocaleString()}<br>Try again tomorrow`; } if(used+amt>LIMIT){msg.className='text-xs mt-3 p-3 rounded-xl bg-red-50 border border-red-200'; return msg.innerHTML=`⛔ <b>You have passed your daily limit!</b><br>Daily Limit: $${LIMIT.toLocaleString()}<br>Used Today: $${used.toLocaleString()}<br>Remaining: $${remain.toLocaleString()}<br>You tried to send: $${amt.toLocaleString()}<br>You fit only send: $${remain.toLocaleString()}`; } if(amt>window.currentUser.checking){msg.className='text-xs mt-3 p-3 rounded-xl bg-red-50'; return msg.innerHTML='<span class=text-red-600>Insufficient balance</span>';} const id=Date.now().toString(); const refId='CFB'+Math.floor(100000000+Math.random()*900000000); const tr={id,from:window.currentUser.accountNumber,fromName:window.currentUser.name,to,toName,amount:amt,status:'PENDING',date:new Date().toLocaleString(),ref:refId}; await setDoc(doc(db,'transfers',id), tr); let newTx=[...(window.currentUser.transactions||[]), {type:'Transfer to '+to, amount:-amt, note:'To '+(toName||to), date:tr.date, status:'PENDING', transferId:id, ref:refId}]; await updateDoc(doc(db,'users',window.currentUser.accountNumber), {transactions:newTx}); msg.className='text-xs mt-3 p-3 rounded-xl bg-amber-50 border border-amber-200'; msg.innerHTML=`⏳ <b>PENDING - Waiting Admin Approval</b><br>Ref: ${refId}<br>Amount: $${amt.toLocaleString()}<br>Check admin.html to approve`; let snap=await getDoc(doc(db,'users',window.currentUser.accountNumber)); afterLogin(snap.data()); setTimeout(()=>openReceipt(id),800);}
window.openReceipt=async(id)=>{let snap=await getDoc(doc(db,'transfers',id)); let tr=snap.exists()?snap.val():null; if(!tr){let found=window.currentUser.transactions.find(t=>t.transferId===id||t.ref===id); if(!found) return alert('Receipt not found'); tr={id:found.transferId||id, amount:Math.abs(found.amount), to:found.note?.replace('To ','')||'', toName:found.note||'', date:found.date, status:found.status||'PENDING', ref:found.ref||'CFB'+id, from:window.currentUser.accountNumber, fromName:window.currentUser.name}} let u=window.currentUser; let color=tr.status==='SUCCESS'?'#16a34a':tr.status==='PENDING'?'#d97706':'#dc2626'; let stampText=tr.status==='SUCCESS'?'SUCCESSFUL':tr.status; let svg=`<svg viewBox="0 0 400 600" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,sans-serif"><rect width="400" height="600" fill="white"/><rect x="0" y="0" width="400" height="72" fill="#0a2540"/><g transform="translate(20,16)"><rect width="34" height="34" rx="8" fill="white" opacity="0.15"/><path d="M8 21L17 9L26 21H8Z" fill="white"/><circle cx="17" cy="23" r="2.5" fill="white"/></g><text x="62" y="30" fill="white" font-weight="800" font-size="14" letter-spacing="0.5">CASHFLOWBANK</text><text x="62" y="46" fill="white" opacity="0.7" font-size="9" letter-spacing="1">OFFICIAL TRANSACTION RECEIPT</text><text x="380" y="32" fill="white" opacity="0.5" font-size="7" text-anchor="end">www.cashflowbank.com</text><text x="380" y="44" fill="white" opacity="0.5" font-size="7" text-anchor="end">Secure • Fast • SVG Receipt</text><rect x="20" y="88" width="360" height="76" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="32" y="108" font-size="10" fill="#64748b" letter-spacing="0.5">TRANSACTION AMOUNT</text><text x="32" y="138" font-size="28" font-weight="800" fill="#0a2540">$${Number(tr.amount).toLocaleString()}.00</text><text x="32" y="154" font-size="10" fill="#64748b">USD • No Fee</text><g transform="translate(285,105)"><rect width="85" height="32" rx="16" fill="${color}" opacity="0.12"/><circle cx="14" cy="16" r="5" fill="${color}"/><text x="26" y="20" font-size="10" font-weight="700" fill="${color}">${tr.status}</text></g><line x1="20" y1="182" x2="380" y2="182" stroke="#e2e8f0" stroke-dasharray="6 4"/><text x="20" y="200" font-size="10" font-weight="700" fill="#0a2540" letter-spacing="0.5">TRANSACTION DETAILS</text><g font-size="11"><text x="20" y="220" fill="#94a3b8">Reference ID:</text><text x="125" y="220" font-family="monospace" font-weight="700" fill="#0f172a">${tr.ref}</text><text x="20" y="238" fill="#94a3b8">Date / Time:</text><text x="125" y="238" fill="#334155">${tr.date}</text><text x="20" y="256" fill="#94a3b8">Transfer Type:</text><text x="125" y="256" fill="#334155">Domestic Wire Transfer</text><text x="20" y="274" fill="#94a3b8">Fee:</text><text x="125" y="274" fill="#16a34a" font-weight="700">$0.00 (Free)</text></g><line x1="20" y1="292" x2="380" y2="292" stroke="#f1f5f9"/><text x="20" y="310" font-size="10" font-weight="700" fill="#0a2540">FROM</text><text x="20" y="326" font-size="12" font-weight="700" fill="#0f172a">${tr.fromName||u.name}</text><text x="20" y="342" font-size="11" font-family="monospace" fill="#334155">Account: ${tr.from}</text><text x="20" y="356" font-size="10" fill="#64748b">CashflowBank • Checking • USD</text><g transform="translate(185,318)"><rect x="0" y="12" width="30" height="2" rx="1" fill="#94a3b8"/><polygon points="30,8 30,18 38,13" fill="#94a3b8"/></g><text x="230" y="310" font-size="10" font-weight="700" fill="#0a2540">TO</text><text x="230" y="326" font-size="12" font-weight="700" fill="#0f172a">${tr.toName||'Recipient'}</text><text x="230" y="342" font-size="11" font-family="monospace" fill="#334155">Account: ${tr.to}</text><text x="230" y="356" font-size="10" fill="#64748b">External Account • USD</text><rect x="20" y="376" width="360" height="1" fill="#f1f5f9"/><g font-size="10"><text x="20" y="394" fill="#94a3b8">DAILY LIMIT TRACKING</text><text x="20" y="410" fill="#64748b">Used Today:</text><text x="20" y="424" font-size="12" font-weight="700" fill="#0f172a">$${(u.usedToday||0).toLocaleString()} / $${(u.dailyLimit||1000000).toLocaleString()}</text><text x="200" y="410" fill="#64748b">Remaining Today:</text><text x="200" y="424" font-size="12" font-weight="700" fill="#16a34a">$${((u.dailyLimit||1000000)-(u.usedToday||0)).toLocaleString()}</text></g><g transform="translate(240,450) rotate(-14)"><rect x="0" y="0" width="130" height="56" rx="8" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="7 4" opacity="0.9"/><text x="65" y="20" text-anchor="middle" font-size="13" font-weight="800" fill="${color}" letter-spacing="1">${stampText}</text><text x="65" y="36" text-anchor="middle" font-size="8" fill="${color}" opacity="0.8">${tr.ref}</text></g><rect x="0" y="560" width="400" height="40" fill="#f8fafc"/><text x="20" y="575" font-size="7.5" fill="#94a3b8">This is a computer-generated receipt. No signature required. For enquiries: support@cashflowbank.com</text><text x="20" y="586" font-size="7" fill="#94a3b8">Ref: ${tr.ref} • Transaction is ${tr.status} • Thank you for banking with CashflowBank • SVG Official Receipt</text></svg>`; document.getElementById('receiptSVGWrap').innerHTML=svg; document.getElementById('receiptModal').classList.remove('hidden');}
window.closeReceipt=()=>document.getElementById('receiptModal').classList.add('hidden');
window.onload=async()=>{let sess=localStorage.getItem('cfb_sess'); if(sess){let snap=await getDoc(doc(db,'users',sess)); if(snap.exists()) afterLogin(snap.data());}}
</script>
