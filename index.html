<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CashflowBank - SVG</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,sans-serif}body{background:#f1f4f8}</style>
</head>
<body>
<header class="bg-white border-b sticky top-0 z-30 flex items-center justify-between px-4 h-[60px]">
  <div class="flex items-center gap-3">
    <button onclick="toggleMenu()" class="w-9 h-9 bg-[#0a2540] text-white rounded-lg flex items-center justify-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <!-- SVG LOGO -->
    <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a2540"/><path d="M8 20L16 8L24 20H8Z" fill="white"/><circle cx="16" cy="22" r="2" fill="white"/></svg>
    <b class="text-sm">CASHFLOWBANK</b>
  </div>
  <a href="admin.html" class="text-xs bg-[#0a2540] text-white px-3 py-1.5 rounded-full">Admin</a>
</header>

<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<div id="sidebar" class="fixed left-0 top-0 bottom-0 w-[280px] bg-white z-50 shadow-2xl -translate-x-full transition duration-300 flex flex-col">
  <div class="p-4 flex justify-between items-center border-b"><div class="flex items-center gap-2"><svg width="24" height="24" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a2540"/><path d="M8 20L16 8L24 20H8Z" fill="white"/></svg><b class="text-sm">CashflowBank</b></div><button onclick="toggleMenu()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="flex-1 p-3 space-y-1">
    <button onclick="goMenu('dashboard')" class="w-full text-left px-3 py-2.5 rounded-lg bg-red-50 text-red-600 font-bold text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Dashboard</button>
    <button onclick="goMenu('transfer')" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Transfer</button>
    <button onclick="goMenu('history')" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> History & Receipts</button>
    <button onclick="goMenu('credit')" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Credit Score</button>
    <button onclick="logout()" class="w-full text-left px-3 py-2.5 rounded-lg text-red-600 text-sm mt-6 flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign Out</button>
  </div>
</div>

<div class="max-w-[700px] mx-auto p-4">
  <div id="sec-dashboard" class="sec">
    <div class="bg-[#0a2540] text-white rounded-2xl p-5">
      <div class="flex justify-between"><div><div class="text-[10px] opacity-60 tracking-widest">ACCOUNT NUMBER</div><div id="dashAcct" class="font-mono text-lg font-black tracking-widest">--</div></div><svg width="40" height="28" viewBox="0 0 40 28"><rect width="40" height="28" rx="4" fill="white" opacity="0.15"/><circle cx="14" cy="14" r="8" fill="white" opacity="0.3"/><circle cx="26" cy="14" r="8" fill="white" opacity="0.3"/></svg></div>
      <div id="dashBal" class="text-3xl font-black mt-4">$0.00</div>
      <div class="grid grid-cols-3 gap-2 mt-4">
        <div class="bg-white/10 rounded-xl p-3"><div class="text-[9px] opacity-60">CREDIT</div><div id="dashCredit" class="font-black">--</div></div>
        <div class="bg-white/10 rounded-xl p-3"><div class="text-[9px] opacity-60">LIMIT $1M</div><div id="dashLimit" class="font-bold text-xs">$1,000,000</div><div class="text-[9px] opacity-60">Used <span id="dashUsed">$0</span></div></div>
        <div class="bg-white/10 rounded-xl p-3"><div class="text-[9px] opacity-60">REMAIN</div><div id="dashRemain" class="font-black text-sm text-green-300">$1M</div></div>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-4 mt-3 shadow"><h4 class="font-bold text-sm flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Pending Transfers</h4><div id="pendList" class="mt-2 text-xs divide-y"></div></div>
  </div>

  <div id="sec-transfer" class="sec hidden"><div class="bg-white rounded-2xl p-5 shadow"><h3 class="font-bold flex items-center gap-2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Send Money (1M Limit)</h3><div class="mt-3 p-3 bg-blue-50 border rounded-xl text-[11px] flex justify-between"><span>Used: <b id="transferUsed">$0</b></span><span>Remain: <b id="transferRemain" class="text-green-700">$1M</b></span></div><input id="tAmount" type="number" placeholder="Amount" class="w-full border rounded-xl px-4 h-11 mt-3 text-sm"/><input id="tTo" placeholder="To Account (10 digits)" maxlength="10" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm font-mono"/><input id="tToName" placeholder="Recipient Name" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><input id="tPin" type="password" placeholder="4-digit PIN" maxlength="4" class="w-full border-2 border-amber-300 bg-amber-50 rounded-xl px-4 h-11 mt-2 text-sm font-bold"/><button onclick="doTransfer()" class="w-full bg-[#0a2540] text-white h-11 rounded-xl mt-3 font-bold text-sm flex items-center justify-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Request Transfer</button><div id="tMsg" class="text-xs mt-2"></div></div></div>

  <div id="sec-history" class="sec hidden"><div class="bg-white rounded-2xl p-5 shadow"><h3 class="font-bold">History & SVG Receipts</h3><div id="txList" class="mt-3 text-xs divide-y"></div></div></div>
  <div id="sec-credit" class="sec hidden"><div class="bg-white rounded-2xl p-6 shadow text-center"><h3 class="font-bold">Credit Score</h3><div class="mt-6 relative w-[180px] h-[180px] mx-auto"><svg class="w-full h-full -rotate-90" viewBox="0 0 180 180"><circle cx="90" cy="90" r="75" stroke="#e5e7eb" stroke-width="12" fill="none"/><circle id="creditCircle" cx="90" cy="90" r="75" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="471" stroke-dashoffset="471" class="transition-all duration-1000"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><div id="creditBig" class="text-4xl font-black">--</div><div id="creditLabel" class="text-[11px] font-bold mt-1 px-3 py-1 rounded-full"></div></div></div></div></div>

  <div id="authBox" class="bg-white rounded-2xl p-5 shadow mt-4">
    <div class="flex gap-2 mb-4"><button id="tabCreate" onclick="switchTab('create')" class="flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold">Create</button><button id="tabLogin" onclick="switchTab('login')" class="flex-1 border h-10 rounded-xl text-sm">Login</button></div>
    <div id="formCreate"><select id="rType" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"><option value="checking">Checking</option><option value="savings">Savings</option><option value="both">Both</option></select><select id="rCountry" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"><option>Nigeria</option><option>United States</option><option>UK</option><option>Canada</option><option>Other</option></select><input id="rName" placeholder="Full Name" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><input id="rEmail" placeholder="Email" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><input id="rPass" type="password" placeholder="Password" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><input id="rPin" type="password" placeholder="4-digit PIN" maxlength="4" class="w-full border-2 border-amber-300 bg-amber-50 rounded-xl px-4 h-11 mt-2 text-sm font-bold"/><button onclick="register()" class="w-full bg-[#0a2540] text-white h-11 rounded-xl mt-3 font-bold text-sm">Create Account</button><div id="createResult" class="mt-3 hidden bg-green-50 border rounded-xl p-3 text-xs"></div></div>
    <div id="formLogin" class="hidden"><input id="lAcct" placeholder="10-digit Number" maxlength="10" class="w-full border-2 border-blue-300 bg-blue-50 rounded-xl px-4 h-11 mt-3 text-sm font-mono font-bold"/><input id="lPass" type="password" placeholder="Password" class="w-full border rounded-xl px-4 h-11 mt-2 text-sm"/><button onclick="login()" class="w-full bg-black text-white h-11 rounded-xl mt-3 font-bold text-sm">Login</button></div><div id="uMsg" class="text-xs mt-2"></div>
  </div>
</div>

<!-- SVG RECEIPT MODAL -->
<div id="receiptModal" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-[400px] w-full overflow-hidden">
    <div id="receiptSVGWrap"></div>
    <div class="p-3 flex gap-2"><button onclick="closeReceipt()" class="flex-1 border h-10 rounded-xl text-sm">Close</button><button onclick="printReceipt()" class="flex-1 bg-black text-white h-10 rounded-xl text-sm font-bold">Print / Save</button></div>
  </div>
</div>

<script>
const getUsers=()=>JSON.parse(localStorage.getItem('cfb_final_shared')||'[]');
const saveUsers=u=>localStorage.setItem('cfb_final_shared', JSON.stringify(u));
const getTransfers=()=>JSON.parse(localStorage.getItem('cfb_transfers')||'[]');
const saveTransfers=t=>localStorage.setItem('cfb_transfers', JSON.stringify(t));
function toggleMenu(){const s=document.getElementById('sidebar'),o=document.getElementById('overlay'); s.classList.contains('-translate-x-full')?(s.classList.remove('-translate-x-full'),o.classList.remove('hidden')):(s.classList.add('-translate-x-full'),o.classList.add('hidden'))}
function goMenu(id){document.querySelectorAll('.sec').forEach(e=>e.classList.add('hidden')); document.getElementById('sec-'+id)?.classList.remove('hidden'); if(!document.getElementById('sidebar').classList.contains('-translate-x-full')) toggleMenu();}
function switchTab(t){document.getElementById('formCreate').classList.toggle('hidden', t!=='create'); document.getElementById('formLogin').classList.toggle('hidden', t!=='login'); document.getElementById('tabCreate').className=t==='create'?'flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold':'flex-1 border h-10 rounded-xl text-sm'; document.getElementById('tabLogin').className=t==='login'?'flex-1 bg-[#0a2540] text-white h-10 rounded-xl text-sm font-bold':'flex-1 border h-10 rounded-xl text-sm';}
function genAcctNum(){return Math.floor(1000000000+Math.random()*9000000000).toString();}
function getCreditInfo(s){if(s>=800)return {l:'Excellent',c:'#16a34a',bg:'bg-green-100 text-green-700'}; if(s>=740)return {l:'Very Good',c:'#2563eb',bg:'bg-blue-100 text-blue-700'}; if(s>=670)return {l:'Good',c:'#d97706',bg:'bg-amber-100 text-amber-700'}; return {l:'Fair',c:'#dc2626',bg:'bg-red-100 text-red-700'};}
function setCreditVisual(score){const info=getCreditInfo(score); document.getElementById('creditBig').innerText=score; document.getElementById('creditLabel').innerText=info.l; document.getElementById('creditLabel').className='text-[11px] font-bold mt-1 px-3 py-1 rounded-full '+info.bg; document.getElementById('dashCredit').innerText=score; const pct=(score-300)/550; document.getElementById('creditCircle').style.stroke=info.c; document.getElementById('creditCircle').style.strokeDashoffset=471-(471*pct);}

function register(){const name=rName.value.trim(),email=rEmail.value.toLowerCase().trim(),pass=rPass.value,pin=rPin.value,type=rType.value,country=rCountry.value; if(!name||!email||!pass||!pin) return alert('Fill all'); if(pin.length!==4) return alert('4-digit PIN'); let users=getUsers(); if(users.find(x=>x.email===email)) return alert('Exists'); let acct=genAcctNum(); while(users.find(x=>x.accountNumber===acct)){acct=genAcctNum();} users.push({accountNumber:acct,name,email,pass,pin,type,country,status:'PENDING',checking:0,savings:0,dailyLimit:1000000,usedToday:0,lastReset:Date.now(),creditScore:Math.floor(650+Math.random()*150),transactions:[]}); saveUsers(users); const res=document.getElementById('createResult'); res.classList.remove('hidden'); res.innerHTML=`Account PENDING<br><b class="font-mono text-[18px]">${acct}</b>`;}
function login(){let acct=lAcct.value.replace(/\D/g,'').trim(),pass=lPass.value; let u=getUsers().find(x=>x.accountNumber===acct&&x.pass===pass); if(!u) return uMsg.innerHTML='<span class=text-red-600>Wrong</span>'; if(u.status!=='APPROVED') return uMsg.innerHTML=`Status: ${u.status}`; let today=new Date().toDateString(); if(new Date(u.lastReset||Date.now()).toDateString()!==today){u.usedToday=0; u.lastReset=Date.now(); saveUsers(getUsers().map(x=>x.accountNumber===u.accountNumber?u:x));} localStorage.setItem('cfb_sess',u.accountNumber); afterLogin(u);}
function afterLogin(u){
 document.getElementById('authBox').classList.add('hidden'); goMenu('dashboard');
 dashAcct.innerText=u.accountNumber; dashBal.innerText='$'+u.checking.toLocaleString(); dashCredit.innerText=u.creditScore; dashLimit.innerText='$'+(u.dailyLimit||1000000).toLocaleString(); dashUsed.innerText='$'+(u.usedToday||0).toLocaleString(); let remain=(u.dailyLimit||1000000)-(u.usedToday||0); if(remain<0) remain=0; dashRemain.innerText='$'+remain.toLocaleString(); transferUsed.innerText='$'+(u.usedToday||0).toLocaleString(); transferRemain.innerText='$'+remain.toLocaleString(); setCreditVisual(u.creditScore);
 const myTransfers=getTransfers().filter(t=>t.from===u.accountNumber); const pend=myTransfers.filter(t=>t.status==='PENDING');
 pendList.innerHTML=pend.slice().reverse().map(t=>`<div class="py-3 flex justify-between items-center"><div><b>$${t.amount}</b> to <span class="font-mono">${t.to}</span><div class="text-[10px] text-amber-600 font-bold">PENDING</div><div class="text-[10px] text-gray-400">${t.date}</div></div><div class="flex flex-col gap-1"><span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-full text-[10px]">PENDING</span><button onclick="openReceipt('${t.id}')" class="text-[10px] underline">View Receipt</button></div></div>`).join('')||'No pending';
 txList.innerHTML=(u.transactions||[]).slice().reverse().map(t=>`<div class="py-3 flex justify-between items-center"><div><div class="font-bold flex items-center gap-2">${t.type} <span class="text-[10px] ${t.status==='PENDING'?'bg-amber-100 text-amber-700':t.status==='SUCCESS'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} px-2 py-0.5 rounded-full">${t.status||'SUCCESS'}</span></div><div class="text-[10px] text-gray-400">${t.note} • ${t.date}</div></div><div class="text-right"><b class="${t.amount>0?'text-green-600':'text-red-600'}">${t.amount>0?'+':''}$${t.amount.toLocaleString()}</b><br><button onclick="openReceipt('${t.transferId||t.date}')" class="text-[10px] underline text-blue-600">Receipt</button></div></div>`).join('')||'No history';
 window.currentUser=u;
}
function logout(){localStorage.removeItem('cfb_sess'); authBox.classList.remove('hidden');}
function doTransfer(){
 const amt=parseFloat(tAmount.value), to=tTo.value.replace(/\D/g,'').trim(), toName=tToName.value.trim(), pin=tPin.value;
 if(!amt||!to) return tMsg.innerText='Fill all'; if(pin!==window.currentUser.pin) return tMsg.innerHTML='<span class=text-red-600>Wrong PIN</span>';
 let today=new Date().toDateString(); if(new Date(window.currentUser.lastReset||Date.now()).toDateString()!==today){window.currentUser.usedToday=0; window.currentUser.lastReset=Date.now();}
 const LIMIT=window.currentUser.dailyLimit||1000000; const used=window.currentUser.usedToday||0; const remain=LIMIT-used;
 if(used>=LIMIT) return tMsg.innerHTML=`<span class="text-red-600 font-bold">⛔ You have passed your daily limit of $${LIMIT.toLocaleString()}</span>`;
 if(used+amt>LIMIT) return tMsg.innerHTML=`<span class="text-red-600 font-bold">⛔ Limit exceeded! Remaining: $${remain.toLocaleString()}</span>`;
 if(amt>window.currentUser.checking) return tMsg.innerHTML='<span class=text-red-600>Insufficient</span>';
 const tr={id:Date.now(), from:window.currentUser.accountNumber, fromName:window.currentUser.name, to:to, toName:toName, amount:amt, status:'PENDING', date:new Date().toLocaleString(), ref:'CFB'+Math.floor(100000000+Math.random()*900000000)};
 let all=getTransfers(); all.push(tr); saveTransfers(all);
 window.currentUser.transactions=window.currentUser.transactions||[];
 window.currentUser.transactions.push({type:'Transfer to '+to, amount:-amt, note:'To '+(toName||to), date:tr.date, status:'PENDING', transferId:tr.id, ref:tr.ref});
 let users=getUsers(); users=users.map(x=>x.accountNumber===window.currentUser.accountNumber?window.currentUser:x); saveUsers(users);
 tMsg.innerHTML=`<span class="text-amber-600 font-bold">⏳ PENDING - Waiting admin approval</span>`; afterLogin(window.currentUser); setTimeout(()=>openReceipt(tr.id),500);
}
function openReceipt(id){
 let transfers=getTransfers(); let users=getUsers(); let u=window.currentUser||users.find(x=>x.accountNumber===localStorage.getItem('cfb_sess'));
 let tr=transfers.find(t=>t.id==id) || u.transactions.find(t=>t.transferId==id || t.date==id);
 if(!tr) return;
 let amount=tr.amount||Math.abs(tr.amount)||0;
 let status=tr.status||'SUCCESS';
 let ref=tr.ref||tr.ref||('CFB'+tr.id);
 let to=tr.to||'--'; let toName=tr.toName||tr.note||'';
 let from=u.accountNumber; let fromName=u.name;
 let color=status==='SUCCESS'?'#16a34a':status==='PENDING'?'#d97706':'#dc2626';
 let stampText=status==='SUCCESS'?'SUCCESSFUL':status;
 let svg=`<svg viewBox="0 0 400 560" width="100%" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <rect width="400" height="560" fill="white"/>
  <rect x="0" y="0" width="400" height="70" fill="#0a2540"/>
  <g transform="translate(20,15)"><rect width="32" height="32" rx="8" fill="white" opacity="0.2"/><path d="M8 20L16 8L24 20H8Z" fill="white"/><circle cx="16" cy="22" r="2" fill="white"/></g>
  <text x="60" y="28" fill="white" font-family="Inter" font-weight="800" font-size="14">CASHFLOWBANK</text>
  <text x="60" y="45" fill="white" opacity="0.7" font-size="9">OFFICIAL TRANSACTION RECEIPT</text>
  <text x="380" y="30" fill="white" font-size="8" text-anchor="end" opacity="0.6">www.cashflowbank.com</text>
  <text x="380" y="45" fill="white" font-size="8" text-anchor="end" opacity="0.6">${new Date().toLocaleString()}</text>

  <rect x="20" y="85" width="360" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="105" font-size="10" fill="#64748b">TRANSACTION AMOUNT</text>
  <text x="30" y="135" font-size="26" font-weight="
