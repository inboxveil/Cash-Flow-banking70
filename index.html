<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CashflowBank</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script></head><body style="background:#f1f4f8;font-family:sans-serif">
<div style="max-width:420px;margin:0 auto">
<header style="background:white;border-bottom:1px solid #eee;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0"><div style="display:flex;align-items:center;gap:10px"><button id="menuBtn" style="width:36px;height:36px;background:#0a2540;color:white;border-radius:10px;border:none">☰</button><b>CASHFLOWBANK</b></div><a href="admin.html" style="background:#0a2540;color:white;padding:6px 12px;border-radius:20px;font-size:11px;text-decoration:none">Admin</a></header>

<div id="mainCard" style="background:#0a2540;color:white;border-radius:20px;padding:20px;margin:16px">
<div style="font-size:10px;opacity:0.6">ACCOUNT NUMBER (10 DIGIT ONLY)</div><div id="dashAcct" style="font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:2px">--</div>
<div id="dashBal" style="font-size:30px;font-weight:800;margin-top:16px">$0.00</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px"><div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px"><div style="font-size:9px;opacity:0.6">CREDIT</div><div id="dashCredit" style="font-weight:bold">--</div></div><div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px"><div style="font-size:9px;opacity:0.6">LIMIT $1M</div><div id="dashLimit" style="font-size:12px">$1,000,000</div><div style="font-size:9px">Used <span id="dashUsed">$0</span></div></div><div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px"><div style="font-size:9px;opacity:0.6">REMAIN</div><div id="dashRemain" style="color:#4ade80;font-weight:bold">$1M</div></div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:0 16px">
<button id="btnSend" style="background:white;border-radius:16px;padding:12px;border:1px solid #eee"><div style="width:44px;height:44px;background:#0a2540;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto">↗</div><div style="font-size:11px;margin-top:6px;font-weight:600">Send</div></button>
<button id="btnHist2" style="background:white;border-radius:16px;padding:12px;border:1px solid #eee"><div style="width:44px;height:44px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto">🕒</div><div style="font-size:11px;margin-top:6px">History</div></button>
<button style="background:white;border-radius:16px;padding:12px;border:1px solid #eee;opacity:0.6"><div style="width:44px;height:44px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto">💳</div><div style="font-size:11px;margin-top:6px">Cards</div></button>
<button style="background:white;border-radius:16px;padding:12px;border:1px solid #eee;opacity:0.6"><div style="width:44px;height:44px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto">💬</div><div style="font-size:11px;margin-top:6px">Help</div></button>
</div>

<div id="sec-dashboard" class="sec" style="background:white;border-radius:20px;padding:16px;margin:16px;border:1px solid #eee"><h4 style="font-weight:bold;font-size:13px">⏳ Pending Transfers (Wait Admin) <span id="pendingCount" style="background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:20px;font-size:10px">0</span></h4><div id="pendList" style="font-size:12px;margin-top:10px"></div></div>
<div id="sec-transfer" class="sec" style="display:none;background:white;border-radius:20px;padding:20px;margin:16px;border:1px solid #eee"><h3 style="font-weight:bold">Transfer - $1M Daily Limit</h3><div style="background:#eff6ff;padding:10px;border-radius:10px;font-size:11px;margin-top:10px;display:flex;justify-content:space-between"><span>Used: <b id="transferUsed">$0</b></span><span>Remain: <b id="transferRemain">$1M</b></span></div><input id="tAmount" type="number" placeholder="Amount" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:12px"/><input id="tTo" placeholder="To Account 10 digits" maxlength="10" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px"/><input id="tToName" placeholder="Recipient Name" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px"/><input id="tPin" type="password" placeholder="4-digit PIN" maxlength="4" style="width:100%;border:2px solid #fbbf24;background:#fffbeb;border-radius:12px;padding:12px;margin-top:8px"/><button id="doTransferBtn" style="width:100%;background:#0a2540;color:white;height:48px;border-radius:12px;margin-top:12px;font-weight:bold;border:none">Request Transfer - PENDING</button><div id="tMsg" style="font-size:12px;margin-top:10px;display:none;padding:10px;border-radius:10px"></div></div>
<div id="sec-history" class="sec" style="display:none;background:white;border-radius:20px;padding:20px;margin:16px;border:1px solid #eee"><h3 style="font-weight:bold">History & Receipt</h3><div id="txList" style="font-size:12px;margin-top:10px"></div></div>

<div style="background:white;border-radius:20px;padding:8px;margin:16px;display:flex;gap:8px;position:sticky;bottom:10px;border:1px solid #eee"><button id="navDash" style="flex:1;background:#0a2540;color:white;height:44px;border-radius:12px;font-size:12px;font-weight:bold;border:none">Dashboard</button><button id="navTrans" style="flex:1;height:44px;border-radius:12px;font-size:12px;border:1px solid #eee;background:white">Transfer</button><button id="navHist" style="flex:1;height:44px;border-radius:12px;font-size:12px;border:1px solid #eee;background:white">History</button></div>

<div id="authBox" style="background:white;border-radius:20px;padding:20px;margin:16px;border:1px solid #eee"><div style="display:flex;gap:8px;background:#f3f4f6;padding:4px;border-radius:12px"><button id="tabCreate" style="flex:1;background:white;height:40px;border-radius:10px;font-size:12px;font-weight:bold;border:none;box-shadow:0 1px 2px rgba(0,0,0,0.1)">Create</button><button id="tabLogin" style="flex:1;height:40px;border-radius:10px;font-size:12px;border:none;background:transparent">Login</button></div><div id="formCreate" style="margin-top:16px"><input id="rName" placeholder="Full Name" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px"/><input id="rEmail" placeholder="Email" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px"/><input id="rPass" type="password" placeholder="Password" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px"/><input id="rPin" type="password" placeholder="4-digit PIN" maxlength="4" style="width:100%;border:2px solid #fbbf24;background:#fffbeb;border-radius:12px;padding:12px;margin-top:8px"/><button id="registerBtn" style="width:100%;background:#0a2540;color:white;height:48px;border-radius:12px;margin-top:12px;font-weight:bold;border:none">Create Account (10-digit)</button><div id="createResult" style="display:none;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;margin-top:12px;font-size:12px"></div></div><div id="formLogin" style="display:none;margin-top:16px"><input id="lAcct" placeholder="10-digit Account" maxlength="10" style="width:100%;border:2px solid #93c5fd;background:#eff6ff;border-radius:12px;padding:12px;font-family:monospace;font-weight:bold"/><input id="lPass" type="password" placeholder="Password" style="width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px"/><button id="loginBtn" style="width:100%;background:black;color:white;height:48px;border-radius:12px;margin-top:12px;font-weight:bold;border:none">Login</button></div><div id="uMsg" style="font-size:12px;margin-top:12px;text-align:center"></div></div>
</div>

<div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:40;display:none"></div><div id="sidebar" style="position:fixed;left:0;top:0;bottom:0;width:300px;background:white;z-index:50;transform:translateX(-100%);transition:0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.2)"><div style="padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b>CASHFLOWBANK</b><button id="closeMenu" style="width:32px;height:32px;background:#f3f4f6;border-radius:50%;border:none">✕</button></div><div style="padding:12px"><button id="sideDash" style="width:100%;text-align:left;padding:12px 16px;border-radius:12px;background:#0a2540;color:white;font-weight:bold;font-size:14px;border:none">Dashboard</button><button id="sideTrans" style="width:100%;text-align:left;padding:12px 16px;border-radius:12px;font-size:14px;border:none;background:white;margin-top:4px">Transfer</button><button id="sideHist" style="width:100%;text-align:left;padding:12px 16px;border-radius:12px;font-size:14px;border:none;background:white;margin-top:4px">History</button><button id="sideLogout" style="width:100%;text-align:left;padding:12px 16px;border-radius:12px;color:red;font-size:14px;border:none;background:white;margin-top:20px;border-top:1px solid #eee">Sign Out</button></div></div>

<div id="receiptModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px"><div style="background:white;border-radius:20px;max-width:400px;width:100%;overflow:hidden"><div id="receiptSVGWrap"></div><div style="padding:12px;display:flex;gap:8px;background:#f9fafb"><button id="closeRec" style="flex:1;border:1px solid #ddd;background:white;height:44px;border-radius:12px">Close</button><button onclick="window.print()" style="flex:1;background:black;color:white;height:44px;border-radius:12px;border:none">Print</button></div></div></div>

<script>
// FIREBASE
const firebaseConfig = { apiKey: "AIzaSyDuYtiY8VISaRA0dHvxgzVGPOcI_DilAH0", authDomain: "cash-flow-banking70.firebaseapp.com", projectId: "cash-flow-banking70", storageBucket: "cash-flow-banking70.firebasestorage.app", messagingSenderId: "1066612075328", appId: "1:1066612075328:web:3472b082cc86aa7d4428a5" };
firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
function genAcctNum(){return Math.floor(1000000000+Math.random()*9000000000).toString();}
let currentUser=null;
function showSec(id){document.querySelectorAll('.sec').forEach(e=>e.style.display='none'); document.getElementById('sec-'+id).style.display='block';}
function toggleMenu(){let s=document.getElementById('sidebar'), o=document.getElementById('overlay'); if(s.style.transform==='translateX(-100%)' || s.style.transform===''){s.style.transform='translateX(0)';o.style.display='block'}else{s.style.transform='translateX(-100%)';o.style.display='none'}}

// BUTTONS - DIRECT
document.getElementById('menuBtn').addEventListener('click', toggleMenu);
document.getElementById('closeMenu').addEventListener('click', toggleMenu);
document.getElementById('overlay').addEventListener('click', toggleMenu);
document.getElementById('navDash').addEventListener('click', ()=>showSec('dashboard'));
document.getElementById('navTrans').addEventListener('click', ()=>showSec('transfer'));
document.getElementById('navHist').addEventListener('click', ()=>showSec('history'));
document.getElementById('btnSend').addEventListener('click', ()=>showSec('transfer'));
document.getElementById('btnHist2').addEventListener('click', ()=>showSec('history'));
document.getElementById('sideDash').addEventListener('click', ()=>{showSec('dashboard');toggleMenu();});
document.getElementById('sideTrans').addEventListener('click', ()=>{showSec('transfer');toggleMenu();});
document.getElementById('sideHist').addEventListener('click', ()=>{showSec('history');toggleMenu();});
document.getElementById('sideLogout').addEventListener('click', ()=>{localStorage.removeItem('cfb_sess');location.reload();});
document.getElementById('tabCreate').addEventListener('click', ()=>{document.getElementById('formCreate').style.display='block';document.getElementById('formLogin').style.display='none';document.getElementById('tabCreate').style.background='white';document.getElementById('tabLogin').style.background='transparent';});
document.getElementById('tabLogin').addEventListener('click', ()=>{document.getElementById('formLogin').style.display='block';document.getElementById('formCreate').style.display='none';document.getElementById('tabLogin').style.background='white';document.getElementById('tabCreate').style.background='transparent';});
document.getElementById('closeRec').addEventListener('click', ()=>{document.getElementById('receiptModal').style.display='none';});

// REGISTER
document.getElementById('registerBtn').addEventListener('click', async()=>{
 const name=document.getElementById('rName').value.trim(), email=document.getElementById('rEmail').value.trim(), pass=document.getElementById('rPass').value, pin=document.getElementById('rPin').value;
 if(!name||!email||!pass||!pin){alert('Fill all');return} if(pin.length!==4){alert('4-digit PIN');return}
 let acct=genAcctNum(); let snap=await db.collection('users').doc(acct).get(); while(snap.exists){acct=genAcctNum(); snap=await db.collection('users').doc(acct).get();}
 await db.collection('users').doc(acct).set({accountNumber:acct,name,email,pass,pin,status:'PENDING',checking:500,savings:0,dailyLimit:1000000,usedToday:0,lastReset:Date.now(),creditScore:713,transactions:[],createdAt:Date.now()});
 let res=document.getElementById('createResult'); res.style.display='block'; res.innerHTML='✅ Created! Number: <b style="font-family:monospace;font-size:20px">'+acct+'</b><br>Go to admin.html PIN admin123 to approve'; document.getElementById('lAcct').value=acct;
 document.getElementById('uMsg').innerText='Now go admin link approve';
});

// LOGIN
document.getElementById('loginBtn').addEventListener('click', async()=>{
 let acct=document.getElementById('lAcct').value.replace(/\D/g,'').trim(), pass=document.getElementById('lPass').value;
 if(acct.length!==10){alert('10 digits');return} let snap=await db.collection('users').doc(acct).get(); if(!snap.exists){document.getElementById('uMsg').innerHTML='<span style=color:red>No account</span>';return}
 let u=snap.data(); if(u.pass!==pass){document.getElementById('uMsg').innerHTML='<span style=color:red>Wrong pass</span>';return}
 if(u.status!=='APPROVED'){document.getElementById('uMsg').innerHTML='<span style=color:red>Status: '+u.status+' - Admin not approve yet</span>';return}
 let today=new Date().toDateString(); if(new Date(u.lastReset||Date.now()).toDateString()!==today){await db.collection('users').doc(acct).update({usedToday:0,lastReset:Date.now()}); u.usedToday=0;}
 localStorage.setItem('cfb_sess',acct); afterLogin(u);
});

async function afterLogin(u){
 document.getElementById('authBox').style.display='none'; showSec('dashboard');
 document.getElementById('dashAcct').innerText=u.accountNumber; document.getElementById('dashBal').innerText='$'+Number(u.checking).toLocaleString()+'.00'; document.getElementById('dashCredit').innerText=u.creditScore;
 document.getElementById('dashLimit').innerText='$'+(u.dailyLimit||1000000).toLocaleString(); document.getElementById('dashUsed').innerText='$'+(u.usedToday||0).toLocaleString();
 let remain=(u.dailyLimit||1000000)-(u.usedToday||0); if(remain<0) remain=0; document.getElementById('dashRemain').innerText='$'+remain.toLocaleString(); document.getElementById('transferUsed').innerText='$'+(u.usedToday||0).toLocaleString(); document.getElementById('transferRemain').innerText='$'+remain.toLocaleString();
 let q=await db.collection('transfers').where('from','==',u.accountNumber).get(); let transfers=[]; q.forEach(d=>transfers.push(d.data())); let pend=transfers.filter(t=>t.status==='PENDING');
 document.getElementById('pendingCount').innerText=pend.length;
 document.getElementById('pendList').innerHTML=pend.reverse().map(t=>`<div style="padding:12px 0;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between"><div><b>$${Number(t.amount).toLocaleString()} → ${t.to}</b><div style="font-size:10px;background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:4px">⏳ PENDING - ${t.ref}</div><div style="font-size:10px;color:#9ca3af">${t.date}</div></div><button onclick="openReceipt('${t.id}')" style="font-size:10px;background:#f3f4f6;padding:6px 12px;border-radius:20px;border:none">Receipt</button></div>`).join('')||'<div style="text-align:center;color:#9ca3af;padding:16px">No pending ✓</div>';
 let txs=(u.transactions||[]).slice().reverse();
 document.getElementById('txList').innerHTML=txs.map(t=>`<div style="padding:12px 0;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between"><div><div style="font-weight:bold;font-size:12px">${t.type} <span style="font-size:9px;background:${t.status==='PENDING'?'#fef3c7':'#dcfce7'};padding:2px 8px;border-radius:20px">${t.status}</span></div><div style="font-size:10px;color:#9ca3af">${t.note} • ${t.date} • ${t.ref||''}</div></div><div><b>$${Number(t.amount).toLocaleString()}</b><br><button onclick="openReceipt('${t.transferId||''}')" style="font-size:10px;color:blue;background:none;border:none;text-decoration:underline">Receipt</button></div></div>`).join('')||'No history';
 currentUser=u;
}

// TRANSFER
document.getElementById('doTransferBtn').addEventListener('click', async()=>{
 const amt=parseFloat(document.getElementById('tAmount').value), to=document.getElementById('tTo').value.replace(/\D/g,'').trim(), toName=document.getElementById('tToName').value.trim(), pin=document.getElementById('tPin').value;
 let msg=document.getElementById('tMsg'); msg.style.display='block';
 if(!amt||!to){msg.innerHTML='Fill all';msg.style.background='#fef2f2';return}
 if(pin!==currentUser.pin){msg.innerHTML='Wrong PIN';msg.style.background='#fef2f2';return}
 const LIMIT=currentUser.dailyLimit||1000000; const used=currentUser.usedToday||0; const remain=LIMIT-used;
 if(used>=LIMIT){msg.style.background='#fef2f2'; msg.innerHTML=`⛔ You have passed your daily limit of $${LIMIT.toLocaleString()}<br>Remaining $0`;return}
 if(used+amt>LIMIT){msg.style.background='#fef2f2'; msg.innerHTML=`⛔ Limit! Remain $${remain.toLocaleString()} - You tried $${amt.toLocaleString()}`;return}
 if(amt>currentUser.checking){msg.style.background='#fef2f2'; msg.innerHTML='Insufficient';return}
 const id=Date.now().toString(); const refId='CFB'+Math.floor(100000000+Math.random()*900000000);
 const tr={id,from:currentUser.accountNumber,fromName:currentUser.name,to,toName,amount:amt,status:'PENDING',date:new Date().toLocaleString(),ref:refId};
 await db.collection('transfers').doc(id).set(tr);
 let newTx=[...(currentUser.transactions||[]), {type:'Transfer to '+to, amount:-amt, note:'To '+(toName||to), date:tr.date, status:'PENDING', transferId:id, ref:refId}];
 await db.collection('users').doc(currentUser.accountNumber).update({transactions:newTx});
 msg.style.background='#fffbeb'; msg.innerHTML=`⏳ PENDING - Ref ${refId} - Waiting Admin`;
 let snap=await db.collection('users').doc(currentUser.accountNumber).get(); afterLogin(snap.data()); setTimeout(()=>openReceipt(id),600);
});

window.openReceipt=async(id)=>{
 let snap=await db.collection('transfers').doc(id).get(); let tr=snap.exists?snap.data():null; if(!tr){let f=currentUser.transactions.find(t=>t.transferId===id); if(!f){alert('No receipt');return} tr={id:f.transferId, amount:Math.abs(f.amount), to:f.note?.replace('To ','')||'', toName:f.note||'', date:f.date, status:f.status, ref:f.ref, from:currentUser.accountNumber, fromName:currentUser.name}}
 let color=tr.status==='SUCCESS'?'#16a34a':tr.status==='PENDING'?'#d97706':'#dc2626';
 let svg=`<svg viewBox="0 0 400 500" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="500" fill="white"/><rect x="0" y="0" width="400" height="60" fill="#0a2540"/><text x="20" y="30" fill="white" font-weight="800" font-size="14">CASHFLOWBANK</text><text x="20" y="45" fill="white" opacity="0.7" font-size="9">OFFICIAL RECEIPT</text><rect x="20" y="80" width="360" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="100" font-size="10" fill="#64748b">AMOUNT</text><text x="30" y="125" font-size="24" font-weight="800" fill="#0a2540">$${Number(tr.amount).toLocaleString()}.00</text><g transform="translate(280,95)"><rect width="80" height="28" rx="14" fill="${color}" opacity="0.15"/><text x="40" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${tr.status}</text></g><text x="20" y="180" font-size="11" fill="#94a3b8">Ref:</text><text x="80" y="180" font-size="11" font-family="monospace" font-weight="700">${tr.ref}</text><text x="20" y="200" font-size="11" fill="#94a3b8">Date:</text><text x="80" y="200" font-size="11">${tr.date}</text><text x="20" y="220" font-size="11" fill="#94a3b8">From:</text><text x="80" y="220" font-size="11">${tr.fromName} - ${tr.from}</text><text x="20" y="240" font-size="11" fill="#94a3b8">To:</text><text x="80" y="240" font-size="11">${tr.toName} - ${tr.to}</text><g transform="translate(240,320) rotate(-14)"><rect x="0" y="0" width="120" height="50" rx="8" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="6 3"/><text x="60" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="${color}">${tr.status==='SUCCESS'?'SUCCESSFUL':tr.status}</text></g></svg>`;
 document.getElementById('receiptSVGWrap').innerHTML=svg; document.getElementById('receiptModal').style.display='flex';
}

window.onload=async()=>{let sess=localStorage.getItem('cfb_sess'); if(sess){let snap=await db.collection('users').doc(sess).get(); if(snap.exists) afterLogin(snap.data());}}
</script>
<script type="text/javascript">var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();(function(){var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];s1.async=true;s1.src='https://embed.tawk.to/6aaeb520a09adf344381b520/default';s1.charset='UTF-8';s1.setAttribute('crossorigin','*');s0.parentNode.insertBefore(s1,s0);})();</script>
</body></html>
