<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin - CashflowBank SVG</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#f1f4f8;font-family:Inter,sans-serif">
<div class="max-w-[900px] mx-auto p-4"><div class="bg-white rounded-2xl p-5 shadow mt-6">
<div class="flex justify-between items-center"><div class="flex items-center gap-2"><svg width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a2540"/><path d="M8 20L16 8L24 20H8Z" fill="white"/></svg><h3 class="font-black text-lg">ADMIN SVG</h3></div><a href="index.html" class="text-xs bg-gray-100 px-3 py-1 rounded-full">← Bank</a></div>
<div class="flex gap-2 mt-4"><input id="adminPin" type="password" placeholder="admin123" class="border-2 border-black rounded-xl px-4 h-12 flex-1 font-bold text-sm"/><button onclick="loadAdmin()" class="bg-black text-white px-6 rounded-xl text-sm font-bold flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock</button></div>
<div id="adminStats" class="grid grid-cols-4 gap-2 mt-4 text-xs"></div>
<div class="mt-6"><h4 class="font-black text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg> Pending <span id="pendingBadge" class="bg-amber-500 text-white px-2 py-0.5 rounded-full text-[11px]">0</span></h4><div id="pendingTransfersList" class="mt-3 space-y-3"></div></div>
<hr class="my-6"/><div id="adminList" class="mt-4 space-y-4"></div>
</div></div>
<script>
const ADMIN_PIN="admin123";
const getUsers=()=>JSON.parse(localStorage.getItem('cfb_final_shared')||'[]');
const saveUsers=u=>localStorage.setItem('cfb_final_shared', JSON.stringify(u));
const getTransfers=()=>JSON.parse(localStorage.getItem('cfb_transfers')||'[]');
const saveTransfers=t=>localStorage.setItem('cfb_transfers', JSON.stringify(t));
function loadAdmin(){
 if(adminPin.value!==ADMIN_PIN) return alert('Wrong PIN na admin123');
 let users=getUsers(); let transfers=getTransfers(); let pending=transfers.filter(t=>t.status==='PENDING');
 document.getElementById('adminStats').innerHTML=`<div class="bg-blue-50 rounded-xl p-3"><b class="text-lg">${users.length}</b><div>Users</div></div><div class="bg-green-50 rounded-xl p-3"><b class="text-lg">${users.filter(u=>u.status==='APPROVED').length}</b><div>Approved</div></div><div class="bg-amber-50 rounded-xl p-3"><b class="text-lg">${pending.length}</b><div>Pending</div></div><div class="bg-gray-50 rounded-xl p-3"><b class="text-lg">${transfers.filter(t=>t.status==='SUCCESS').length}</b><div>Success</div></div>`;
 document.getElementById('pendingBadge').innerText=pending.length;
 let pHtml=''; pending.slice().reverse().forEach(tr=>{
   pHtml+=`<div class="border-2 border-amber-200 bg-amber-50 rounded-xl p-4"><div class="flex justify-between"><div><div class="text-xs font-mono">Ref: ${tr.ref}</div><div class="text-xs">From: <b>${tr.from}</b> (${tr.fromName})</div><div class="text-xs">To: <b>${tr.to}</b></div><div class="font-black text-lg">$${tr.amount.toLocaleString()}</div><div class="text-[11px] text-gray-500">${tr.date}</div></div><div class="flex flex-col gap-2"><button onclick="approveTransfer(${tr.id})" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold flex items-center gap-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Approve</button><button onclick="declineTransfer(${tr.id})" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">Decline</button></div></div></div>`;
 });
 document.getElementById('pendingTransfersList').innerHTML=pHtml||'<div class="text-center text-gray-400 text-sm py-6 bg-white rounded-xl border">No pending ✓</div>';
 let html=''; users.forEach(u=>{
   html+=`<div class="border rounded-xl p-4 bg-white"><div class="flex justify-between"><div><b>${u.name}</b> <span class="font-mono text-xs bg-black text-white px-2 py-1 rounded">${u.accountNumber}</span><div class="text-[11px] text-gray-500">${u.email} • ${u.status} • $${u.checking} • Limit: $${(u.dailyLimit||1000000).toLocaleString()} Used: $${(u.usedToday||0).toLocaleString()}</div></div><div class="flex flex-col gap-1"><button onclick="approveUser('${u.accountNumber}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">Approve</button><button onclick="resetLimit('${u.accountNumber}')" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs">Reset 1M</button><button onclick="delUser('${u.accountNumber}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs">Del</button></div></div><div class="grid grid-cols-4 gap-2 mt-3"><input id="c-${u.accountNumber}" value="${u.checking}" type="number" class="w-full border rounded-lg px-2 h-9 text-sm"/><input id="s-${u.accountNumber}" value="${u.savings}" type="number" class="w-full border rounded-lg px-2 h-9 text-sm"/><input id="l-${u.accountNumber}" value="${u.dailyLimit||1000000}" type="number" class="w-full border-2 border-blue-300 bg-blue-50 rounded-lg px-2 h-9 text-sm font-bold"/><input id="cr-${u.accountNumber}" value="${u.creditScore}" type="number" class="w-full border-2 border-green-300 bg-green-50 rounded-lg px-2 h-9 text-sm font-bold"/></div><div class="mt-3 p-3 bg-gray-50 rounded-xl border"><div class="grid grid-cols-3 gap-2"><input id="add-amt-${u.accountNumber}" type="number" placeholder="Amount" class="border rounded-lg px-2 h-10 text-sm font-bold"/><select id="add-where-${u.accountNumber}" class="border rounded-lg px-2 h-10 text-sm"><option value="checking">Checking</option><option value="savings">Savings</option></select><input id="add-note-${u.accountNumber}" placeholder="Note" class="border rounded-lg px-2 h-10 text-sm"/></div><div class="flex gap-2 mt-2"><button onclick="addFunds('${u.accountNumber}')" class="flex-1 bg-green-600 text-white h-10 rounded-lg text-xs font-bold">+ Add</button><button onclick="saveEdit('${u.accountNumber}')" class="flex-1 bg-black text-white h-10 rounded-lg text-xs font-bold">Save</button></div></div></div>`;
 });
 document.getElementById('adminList').innerHTML=html||'No users';
}
function approveTransfer(id){let transfers=getTransfers(); let tr=transfers.find(t=>t.id===id); let users=getUsers(); let sender=users.find(u=>u.accountNumber===tr.from); if(sender.checking<tr.amount) return alert('Insufficient'); if((sender.usedToday||0)+tr.amount>(sender.dailyLimit||1000000)) return alert('Will exceed 1M limit'); sender.checking-=tr.amount; sender.usedToday=(sender.usedToday||0)+tr.amount; let tx=sender.transactions.find(t=>t.transferId===id); if(tx) tx.status='SUCCESS'; tr.status='SUCCESS'; saveTransfers(transfers); saveUsers(users.map(u=>u.accountNumber===sender.accountNumber?sender:u)); loadAdmin();}
function declineTransfer(id){let transfers=getTransfers(); let tr=transfers.find(t=>t.id===id); tr.status='DECLINED'; let users=getUsers(); let sender=users.find(u=>u.accountNumber===tr.from); if(sender){let tx=sender.transactions.find(t=>t.transferId===id); if(tx) tx.status='DECLINED'; saveUsers(users.map(u=>u.accountNumber===sender.accountNumber?sender:u));} saveTransfers(transfers); loadAdmin();}
function approveUser(acct){let users=getUsers(); let u=users.find(x=>x.accountNumber===acct); u.status='APPROVED'; if(u.checking===0) u.checking=500; u.dailyLimit=1000000; u.usedToday=u.usedToday||0; saveUsers(users); loadAdmin();}
function resetLimit(acct){let users=getUsers(); let u=users.find(x=>x.accountNumber===acct); u.usedToday=0; u.lastReset=Date.now(); saveUsers(users); loadAdmin();}
function delUser(acct){saveUsers(getUsers().filter(x=>x.accountNumber!==acct)); saveTransfers(getTransfers().filter(t=>t.from!==acct)); loadAdmin();}
function saveEdit(acct){let users=getUsers(); let u=users.find(x=>x.accountNumber===acct); u.checking=parseFloat(document.getElementById('c-'+acct).value)||0; u.savings=parseFloat(document.getElementById('s-'+acct).value)||0; u.dailyLimit=parseFloat(document.getElementById('l-'+acct).value)||1000000; u.creditScore=parseInt(document.getElementById('cr-'+acct).value)||700; saveUsers(users); loadAdmin();}
function addFunds(acct){let users=getUsers(); let u=users.find(x=>x.accountNumber===acct); let amt=parseFloat(document.getElementById('add-amt-'+acct).value); let where=document.getElementById('add-where-'+acct).value; if(!amt) return; if(where==='checking') u.checking+=amt; else u.savings+=amt; u.transactions.push({type:'Funding - '+where, amount:amt, note:document.getElementById('add-note-'+acct).value||'Admin', date:new Date().toLocaleString(), status:'SUCCESS'}); saveUsers(users); loadAdmin();}
</script></body></html>
