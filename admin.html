<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin - CashflowBank All Features</title><script src="https://cdn.tailwindcss.com"></script><script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script></head><body style="background:#f1f4f8;font-family:Inter,sans-serif"><div class="max-w-[900px] mx-auto p-4"><div class="bg-white rounded-2xl p-5 shadow mt-6"><div class="flex justify-between items-center"><div class="flex items-center gap-2"><svg width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a2540"/><path d="M8 20L16 8L24 20H8Z" fill="white"/></svg><h3 class="font-black text-lg">ADMIN PANEL - SVG + 1M + Receipt</h3></div><a href="index.html" class="text-xs bg-gray-100 px-3 py-1.5 rounded-full font-bold">← Bank</a></div><div class="flex gap-2 mt-5"><input id="adminPin" type="password" placeholder="PIN is admin123" class="border-2 border-black rounded-xl px-4 h-12 flex-1 font-bold text-sm"/><button onclick="loadAdmin()" class="bg-black text-white px-6 rounded-xl text-sm font-bold flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Unlock Admin</button></div><div id="adminStats" class="grid grid-cols-4 gap-2 mt-5 text-xs"></div><div class="mt-6 bg-amber-50 border-2 border-amber-200 rounded-2xl p-4"><h4 class="font-black text-sm flex items-center gap-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Pending Transfers (Approve to SUCCESSFUL) <span id="pendingBadge" class="bg-amber-500 text-white px-2 py-0.5 rounded-full text-[11px]">0</span></h4><div id="pendingTransfersList" class="mt-3 space-y-3"></div></div><hr class="my-6"/><h4 class="font-black text-sm">All Users (10-digit account)</h4><div id="adminList" class="mt-4 space-y-4"></div></div></div><script type="module">
import { initializeApp } from "firebase/app"; import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, deleteDoc } from "firebase/firestore";
const firebaseConfig = { apiKey: "AIzaSyDuYtiY8VISaRA0dHvxgzVGPOcI_DilAH0", authDomain: "cash-flow-banking70.firebaseapp.com", projectId: "cash-flow-banking70", storageBucket: "cash-flow-banking70.firebasestorage.app", messagingSenderId: "1066612075328", appId: "1:1066612075328:web:3472b082cc86aa7d4428a5" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const ADMIN_PIN="admin123";
window.loadAdmin=async()=>{if(document.getElementById('adminPin').value!==ADMIN_PIN) return alert('Wrong PIN! PIN na admin123'); let usersSnap=await getDocs(collection(db,'users')); let users=[]; usersSnap.forEach(d=>users.push(d.data())); let transSnap=await getDocs(collection(db,'transfers')); let transfers=[]; transSnap.forEach(d=>transfers.push(d.data())); let pending=transfers.filter(t=>t.status==='PENDING'); document.getElementById('adminStats').innerHTML=`<div class="bg-blue-50 border rounded-xl p-3"><b class="text-lg">${users.length}</b><div>Users</div></div><div class="bg-green-50 border rounded-xl p-3"><b class="text-lg">${users.filter(u=>u.status==='APPROVED').length}</b><div>Approved</div></div><div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-3"><b class="text-lg">${pending.length}</b><div>Pending</div></div><div class="bg-gray-50 border rounded-xl p-3"><b class="text-lg">${transfers.filter(t=>t.status==='SUCCESS').length}</b><div>Success</div></div>`; document.getElementById('pendingBadge').innerText=pending.length; let pHtml=''; pending.reverse().forEach(tr=>{pHtml+=`<div class="border-2 border-amber-200 bg-white rounded-xl p-4 flex justify-between items-start"><div><div class="text-xs font-mono bg-black text-white px-2 py-1 rounded inline-block">Ref: ${tr.ref}</div><div class="text-xs mt-2">From: <b class="font-mono">${tr.from}</b> (${tr.fromName})</div><div class="text-xs">To: <b class="font-mono">${tr.to}</b> (${tr.toName||''})</div><div class="font-black text-lg mt-1">$${Number(tr.amount).toLocaleString()}.00</div><div class="text-[11px] text-gray-500">${tr.date}</div></div><div class="flex flex-col gap-2"><button onclick="approveTransfer('${tr.id}')" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-full text-xs font-bold flex items-center gap-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Approve → SUCCESSFUL</button><button onclick="declineTransfer('${tr.id}')" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-full text-xs font-bold">✕ Decline</button></div></div>`}); document.getElementById('pendingTransfersList').innerHTML=pHtml||'<div class="text-center text-gray-400 py-6 bg-white rounded-xl border">No pending transfers ✓</div>'; let html=''; users.forEach(u=>{html+=`<div class="border rounded-xl p-4 bg-white"><div class="flex justify-between"><div><b>${u.name}</b> <span class="font-mono text-xs bg-black text-white px-2 py-1 rounded">${u.accountNumber}</span><div class="text-[11px] text-gray-500 mt-1">${u.email} • ${u.status} • Bal $${Number(u.checking).toLocaleString()} • Used $${(u.usedToday||0).toLocaleString()} / $${(u.dailyLimit||1000000).toLocaleString()} • Credit ${u.creditScore}</div></div><div class="flex flex-col gap-1"><button onclick="approveUser('${u.accountNumber}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">Approve</button><button onclick="resetLimit('${u.accountNumber}')" class="bg-blue-50 text-blue-600 border px-3 py-1 rounded-full text-xs">Reset 1M Limit</button><button onclick="delUser('${u.accountNumber}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs">Delete</button></div></div><div class="grid grid-cols-4 gap-2 mt-3"><input id="c-${u.accountNumber}" value="${u.checking}" type="number" class="w-full border rounded-lg px-2 h-9 text-sm"/><input id="s-${u.accountNumber}" value="${u.savings}" type="number" class="w-full border rounded-lg px-2 h-9 text-sm"/><input id="l-${u.accountNumber}" value="${u.dailyLimit||1000000}" type="number" class="w-full border-2 border-blue-300 bg-blue-50 rounded-lg px-2 h-9 text-sm font-bold"/><input id="cr-${u.accountNumber}" value="${u.creditScore}" type="number" class="w-full border-2 border-green-300 bg-green-50 rounded-lg px-2 h-9 text-sm font-bold"/></div><div class="mt-3 bg-gray-50 p-3 rounded-xl border"><div class="grid grid-cols-3 gap-2"><input id="add-amt-${u.accountNumber}" type="number" placeholder="Amount e.g 500000" class="border rounded-lg px-2 h-10 text-sm font-bold"/><select id="add-where-${u.accountNumber}" class="border rounded-lg px-2 h-10 text-sm"><option value="checking">Checking</option><option value="savings">Savings</option></select><input id="add-note-${u.accountNumber}" placeholder="Note e.g Bonus" class="border rounded-lg px-2 h-10 text-sm"/></div><div class="flex gap-2 mt-2"><button onclick="addFunds('${u.accountNumber}')" class="flex-1 bg-green-600 text-white h-10 rounded-lg text-xs font-bold">+ Add Funds</button><button onclick="saveEdit('${u.accountNumber}')" class="flex-1 bg-black text-white h-10 rounded-lg text-xs font-bold">Save Changes</button></div></div></div>`}); document.getElementById('adminList').innerHTML=html||'No users';}
window.approveTransfer=async(id)=>{let tSnap=await getDoc(doc(db,'transfers',id)); let tr=tSnap.data(); let uSnap=await getDoc(doc(db,'users',tr.from)); let u=uSnap.data(); if(u.checking<tr.amount) return alert('Insufficient balance'); if((u.usedToday||0)+tr.amount>(u.dailyLimit||1000000)) return alert('Will exceed 1M daily limit - Reset limit first'); let newChecking=u.checking-tr.amount; let newUsed=(u.usedToday||0)+tr.amount; let txs=[...(u.transactions||[])]; let idx=txs.findIndex(x=>x.transferId===id); if(idx>=0) txs[idx].status='SUCCESS'; else txs.push({type:'Transfer to '+tr.to, amount:-tr.amount, note:'To '+(tr.toName||tr.to), date:tr.date, status:'SUCCESS', transferId:id, ref:tr.ref}); await updateDoc(doc(db,'users',tr.from), {checking:newChecking, usedToday:newUsed, transactions:txs}); await updateDoc(doc(db,'transfers',id), {status:'SUCCESS', approvedDate:new Date().toLocaleString()}); alert('✅ Approved! User go now see SUCCESSFUL + SVG Receipt with stamp'); loadAdmin();}
window.declineTransfer=async(id)=>{let tSnap=await getDoc(doc(db,'transfers',id)); let tr=tSnap.data(); let uSnap=await getDoc(doc(db,'users',tr.from)); let u=uSnap.data(); let txs=[...(u.transactions||[])]; let idx=txs.findIndex(x=>x.transferId===id); if(idx>=0) txs[idx].status='DECLINED'; await updateDoc(doc(db,'users',tr.from), {transactions:txs}); await updateDoc(doc(db,'transfers',id), {status:'DECLINED'}); alert('Declined'); loadAdmin();}
window.approveUser=async(acct)=>{await updateDoc(doc(db,'users',acct), {status:'APPROVED', dailyLimit:1000000, checking:500}); alert('User Approved + $500 added + Limit reset to 1M'); loadAdmin();}
window.resetLimit=async(acct)=>{await updateDoc(doc(db,'users',acct), {usedToday:0, lastReset:Date.now()}); alert('Daily limit reset - User can now send up to 1M again'); loadAdmin();}
window.delUser=async(acct)=>{if(!confirm('Delete account '+acct+'?'))return; await deleteDoc(doc(db,'users',acct)); loadAdmin();}
window.saveEdit=async(acct)=>{let c=parseFloat(document.getElementById('c-'+acct).value)||0; let s=parseFloat(document.getElementById('s-'+acct).value)||0; let l=parseFloat(document.getElementById('l-'+acct).value)||1000000; let cr=parseInt(document.getElementById('cr-'+acct).value)||700; await updateDoc(doc(db,'users',acct), {checking:c,savings:s,dailyLimit:l,creditScore:cr}); alert('Saved'); loadAdmin();}
window.addFunds=async(acct)=>{let amt=parseFloat(document.getElementById('add-amt-'+acct).value); let where=document.getElementById('add-where-'+acct).value; let note=document.getElementById('add-note-'+acct).value||'Admin Deposit'; if(!amt) return alert('Enter amount'); let snap=await getDoc(doc(db,'users',acct)); let u=snap.data(); let newVal=where==='checking'?u.checking+amt:u.savings+amt; let newTxs=[...(u.transactions||[]), {type:'Funding - '+where, amount:amt, note, date:new Date().toLocaleString(), status:'SUCCESS', ref:'CFB'+Math.floor(100000000+Math.random()*900000000)}]; if(where==='checking') await updateDoc(doc(db,'users',acct), {checking:newVal, transactions:newTxs}); else await updateDoc(doc(db,'users',acct), {savings:newVal, transactions:newTxs}); alert('Added $'+amt.toLocaleString()+' to '+where); loadAdmin();}
</script>
