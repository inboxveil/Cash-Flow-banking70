<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CashflowBank - Real</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><style>*{font-family:Inter,sans-serif}body{background:#f5f7fb}</style></head><body>
<header class="bg-white sticky top-0 z-30 border-b"><div class="max-w-[420px] mx-auto px-4 h-[62px] flex items-center justify-between"><div class="flex items-center gap-3"><button id="menuBtn" class="w-9 h-9 rounded-xl bg-[#0a2540] text-white flex items-center justify-center">☰</button><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-[#0a2540] flex items-center justify-center text-white font-black">▲</div><div><div class="font-extrabold text-[13px]">CASHFLOWBANK</div><div class="text-[9px] text-gray-500 -mt-1">PRIVATE</div></div></div></div><a href="admin.html" class="bg-gray-100 text-[#0a2540] text-[11px] px-3 py-1.5 rounded-full font-bold border">Admin</a></div></header>

<div class="max-w-[420px] mx-auto p-4">
<div class="bg-[#0a2540] rounded-[22px] p-5 text-white relative overflow-hidden shadow-xl">
<div class="flex justify-between"><div><div class="text-[10px] opacity-60">ACCOUNT NUMBER (10 DIGIT ONLY)</div><div id="dashAcct" class="font-mono text-[16px] font-bold tracking-widest mt-1">--</div></div><button id="eyeBtn" class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center">👁️</button></div>
<div class="mt-5"><div class="text-[11px] opacity-60">Available Balance</div><div id="dashBal" class="text-[32px] font-extrabold">$0.00</div><div id="dashBalHidden" class="text-[32px] font-extrabold hidden">••••••</div></div>
<div class="grid grid-cols-3 gap-3 mt-5">
<div class="bg-white/10 rounded-[14px] p-3 border border-white/10"><div class="text-[9px] opacity-60">CREDIT SCORE</div><div id="dashCredit" class="font-bold text-[15px] mt-1">--</div></div>
<div class="bg-white/10 rounded-[14px] p-3 border border-white/10"><div class="text-[9px] opacity-60">LIMIT $1M</div><div id="dashLimit" class="font-bold text-[13px] mt-1">$1,000,000</div><div class="text-[9px]">Used <span id="dashUsed">$0</span></div></div>
<div class="bg-white/10 rounded-[14px] p-3 border border-white/10"><div class="text-[9px] opacity-60">REMAIN</div><div id="dashRemain" class="font-bold text-[13px] mt-1 text-green-300">$1M</div></div>
</div>
</div>

<div class="grid grid-cols-4 gap-3 mt-4">
<button id="btnSend" class="bg-white rounded-2xl p-3 shadow-sm border flex flex-col items-center gap-1.5"><div class="w-11 h-11 rounded-full bg-[#0a2540] text-white flex items-center justify-center">↗️</div><span class="text-[11px] font-semibold">Send</span></button>
<button id="btnHist" class="bg-white rounded-2xl p-3 shadow-sm border flex flex-col items-center gap-1.5"><div class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">🕒</div><span class="text-[11px] font-semibold">History</span></button>
<button id="btnCard" class="bg-white rounded-2xl p-3 shadow-sm border flex flex-col items-center gap-1.5"><div class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">💳</div><span class="text-[11px] font-semibold">Cards</span></button>
<button id="btnHelp" class="bg-white rounded-2xl p-3 shadow-sm border flex flex-col items-center gap-1.5"><div class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">💬</div><span class="text-[11px] font-semibold">Help</span></button>
</div>

<div id="sec-dashboard" class="sec mt-4"><div class="bg-white rounded-[20px] p-4 shadow-sm border"><div class="flex justify-between"><h4 class="font-bold text-[13px]">⏳ Pending Transfers</h4><span id="pendingCount" class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">0</span></div><div id="pendList" class="mt-3 divide-y text-xs"></div></div><div class="bg-white rounded-[20px] p-4 shadow-sm border mt-3"><h4 class="font-bold text-[13px]">Recent Activity</h4><div id="txPreview" class="mt-3 divide-y text-xs"></div></div></div>

<div id="sec-transfer" class="sec hidden mt-4"><div class="bg-white rounded-[20px] p-5 shadow-sm border"><h3 class="font-bold text-[14px]">Transfer Funds - 1M Limit</h3><div class="mt-3 p-3 bg-blue-50 border rounded-xl text-[11px] flex justify-between"><span>Used: <b id="transferUsed">$0</b></span><span class="text-green-700 font-bold">Remain: <b id="transferRemain">$1M</b></span></div><input id="tAmount" type="number" placeholder="Amount" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm"/><input id="tTo" placeholder="To Account 10 digits" maxlength="10" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm font-mono"/><input id="tToName" placeholder="Recipient Name" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm"/><input id="tPin" type="password" placeholder="4-digit PIN" maxlength="4" class="w-full border-2 border-amber-200 bg-amber-50 rounded-xl px-4 h-12 mt-3 text-sm font-bold"/><button id="doTransferBtn" class="w-full bg-[#0a2540] text-white h-12 rounded-xl mt-4 font-bold text-sm">Request Transfer - PENDING</button><div id="tMsg" class="text-xs mt-3 p-3 rounded-xl hidden"></div></div></div>

<div id="sec-history" class="sec hidden mt-4"><div class="bg-white rounded-[20px] p-5 shadow-sm border"><h3 class="font-bold text-[14px]">History & SVG Receipt</h3><div id="txList" class="mt-4 divide-y text-xs"></div></div></div>

<div class="mt-6 bg-white rounded-[20px] p-2 shadow-sm border flex gap-2 sticky bottom-4"><button id="navDash" class="flex-1 bg-[#0a2540] text-white h-11 rounded-xl text-[12px] font-bold">Dashboard</button><button id="navTrans" class="flex-1 text-gray-500 h-11 rounded-xl text-[12px] font-bold">Transfer</button><button id="navHist" class="flex-1 text-gray-500 h-11 rounded-xl text-[12px] font-bold">History</button></div>

<div id="authBox" class="bg-white rounded-[20px] p-5 shadow-sm border mt-4"><div class="flex gap-2 mb-5 p-1 bg-gray-100 rounded-xl"><button id="tabCreate" class="flex-1 bg-white shadow h-10 rounded-lg text-[12px] font-bold">Create</button><button id="tabLogin" class="flex-1 h-10 rounded-lg text-[12px] text-gray-500">Login</button></div><div id="formCreate"><input id="rName" placeholder="Full Name" class="w-full border rounded-xl px-4 h-12 text-sm"/><input id="rEmail" placeholder="Email" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm"/><input id="rPass" type="password" placeholder="Password" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm"/><input id="rPin" type="password" placeholder="4-digit PIN" maxlength="4" class="w-full border-2 border-amber-200 bg-amber-50 rounded-xl px-4 h-12 mt-3 text-sm font-bold"/><button id="registerBtn" class="w-full bg-[#0a2540] text-white h-12 rounded-xl mt-4 font-bold text-sm">Create Account (10-digit only)</button><div id="createResult" class="mt-4 hidden bg-green-50 border border-green-200 rounded-xl p-3 text-xs"></div></div><div id="formLogin" class="hidden"><input id="lAcct" placeholder="10-digit Account Number" maxlength="10" class="w-full border-2 border-blue-200 bg-blue-50/50 rounded-xl px-4 h-12 text-sm font-mono font-bold"/><input id="lPass" type="password" placeholder="Password" class="w-full border rounded-xl px-4 h-12 mt-3 text-sm"/><button id="loginBtn" class="w-full bg-black text-white h-12 rounded-xl mt-4 font-bold text-sm">Secure Login</button></div><div id="uMsg" class="text-xs mt-3 text-center"></div></div>
</div>

<div id="overlay" class="fixed inset-0 bg-black/40 z-40 hidden"></div><div id="sidebar" class="fixed left-0 top-0 bottom-0 w-[300px] bg-white z-50 shadow-2xl -translate-x-full transition duration-300"><div class="p-5 flex justify-between border-b"><b>CASHFLOWBANK</b><button id="closeMenu" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div class="p-3 space-y-1"><button id="sideDash" class="w-full text-left px-4 py-3 rounded-xl bg-[#0a2540] text-white font-bold text-sm">Dashboard</button><button id="sideTrans" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-sm">Transfer - 1M Limit</button><button id="sideHist" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-sm">History</button><button id="sideLogout" class="w-full text-left px-4 py-3 rounded-xl text-red-600 text-sm font-bold mt-6 border-t">Sign Out</button></div></div>

<div id="receiptModal" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-4"><div class="bg-white rounded-[20px] max-w-[400px] w-full overflow-hidden"><div id="receiptSVGWrap"></div><div class="p-3 flex gap-2 bg-gray-50"><button id="closeRec" class="flex-1 border bg-white h-11 rounded-xl text-sm font-bold">Close</button><button onclick="window.print()" class="flex-1 bg-black text-white h-11 rounded-xl text-sm font-bold">Print</button></div></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDuYtiY8VISaRA0dHvxgzVGPOcI_DilAH0", authDomain: "cash-flow-banking70.firebaseapp.com", projectId: "cash-flow-banking70", storageBucket: "cash-flow-banking70.firebasestorage.app", messagingSenderId: "1066612075328", appId: "1:1066612075328:web:3472b082cc86aa7d4428a5" };
firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
function genAcctNum(){return Math.floor(1000000000+Math.random()*9000000000).toString();}
let currentUser=null;
function toggleMenu(){let s=document.getElementById('sidebar'), o=document.getElementById('overlay'); if(s.classList.contains('-translate-x-full')){s.classList.remove('-translate-x-full');o.classList.remove('hidden')}else{s.classList.add('-translate-x-full');o.classList.add('hidden')}}
function goMenu(id){document.querySelectorAll('.sec').forEach(e=>e.classList.add('hidden')); document.getElementById('sec-'+id).classList.remove('hidden'); document.getElementById('navDash').className=id==='dashboard'?'flex-1 bg-[#0a2540] text-white h-11 rounded-xl text-[12px] font-bold':'flex-1 text-gray-500 h-11 rounded-xl text-[12px] font-bold'; document.getElementById('navTrans').className=id==='transfer'?'flex-1 bg-[#0a2540] text-white h-11 rounded-xl text-[12px] font-bold':'flex-1 text-gray-500 h-11 rounded-xl text-[12px] font-bold'; document.getElementById('navHist').className=id==='history'?'flex-1 bg-[#0a2540] text-white h-11 rounded-xl text-[12px] font-bold':'flex-1 text-gray-500 h-11 rounded-xl text-[12px] font-bold'; if(!document.getElementById('sidebar').classList.contains('-translate-x-full')) toggleMenu();}
document.getElementById('menuBtn').onclick=toggleMenu; document.getElementById('closeMenu').onclick=toggleMenu; document.getElementById('overlay').onclick=toggleMenu;
document.getElementById('eyeBtn').onclick=()=>{document.getElementById('dashBal').classList.toggle('hidden'); document.getElementById('dashBalHidden').classList.toggle('hidden');}
document.getElementById('navDash').onclick=()=>goMenu('dashboard'); document.getElementById('navTrans').onclick=()=>goMenu('transfer'); document.getElementById('navHist').onclick=()=>goMenu('history');
document.getElementById('btnSend').onclick=()=>goMenu('transfer'); document.getElementById('btnHist').onclick=()=>goMenu('history'); document.getElementById('sideDash').onclick=()=>goMenu('dashboard'); document.getElementById('sideTrans').onclick=()=>goMenu('transfer'); document.getElementById('sideHist').onclick=()=>goMenu('history');
document.getElementById('sideLogout').onclick=()=>{localStorage.removeItem('cfb_sess'); document.getElementById('authBox').classList.remove('hidden');}
document.getElementById('tabCreate').onclick=()=>{document.getElementById('formCreate').classList.remove('hidden'); document.getElementById('formLogin').classList.add('hidden'); document.getElementById('tabCreate').className='flex-1 bg-white shadow h-10 rounded-lg text-[12px] font-bold'; document.getElementById('tabLogin').className='flex-1 h-10 rounded-lg text-[12px] text-gray-500';}
document.getElementById('tabLogin').onclick=()=>{document.getElementById('formLogin').classList.remove('hidden'); document.getElementById('formCreate').classList.add('hidden'); document.getElementById('tabLogin').className='flex-1 bg-white shadow h-10 rounded-lg text-[12px] font-bold'; document.getElementById('tabCreate').className='flex-1 h-10 rounded-lg text-[12px] text-gray-500';}
document.getElementById('closeRec').onclick=()=>document.getElementById('receiptModal').classList.add('hidden');
document.getElementById('registerBtn').onclick=async()=>{
 const name=document.getElementById('rName').value.trim(), email=document.getElementById('rEmail').value.toLowerCase().trim(), pass=document.getElementById('rPass').value, pin=document.getElementById('rPin').value;
 if(!name||!email||!pass||!pin) return alert('Fill all'); if(pin.length!==4) return alert('4-digit PIN');
 let acct=genAcctNum(); let snap=await db.collection('users').doc(acct).get(); while(snap.exists){acct=genAcctNum(); snap=await db.collection('users').doc(acct).get();}
 await db.collection('users').doc(acct).set({accountNumber:acct,name,email,pass,pin,status:'PENDING',checking:500,savings:0,dailyLimit:1000000,usedToday:0,lastReset:Date.now(),creditScore:713,transactions:[],createdAt:Date.now()});
 let res=document.getElementById('createResult'); res.classList.remove('hidden'); res.innerHTML='✅ Created! Account: <b class="font-mono text-[20px]">'+acct+'</b><br>PENDING - Go admin.html approve (PIN admin123)'; document.getElementById('lAcct').value=acct;
}
document.getElementById('loginBtn').onclick=async()=>{
 let acct=document.getElementById('lAcct').value.replace(/\D/g,'').trim(), pass=document.getElementById('lPass').value;
 if(acct.length!==10) return alert('10 digits'); let snap=await db.collection('users').doc(acct).get(); if(!snap.exists) return document.getElementById('uMsg').innerHTML='<span class=text-red-600>No account</span>';
 let u=snap.data(); if(u.pass!==pass) return document.getElementById('uMsg').innerHTML='<span class=text-red-600>Wrong pass</span>';
 if(u.status!=='APPROVED') return document.getElementById('uMsg').innerHTML='<span class=text-red-600>Status: '+u.status+' - Go admin approve</span>';
 let today=new Date().toDateString(); if(new Date(u.lastReset||Date.now()).toDateString()!==today){await db.collection('users').doc(acct).update({usedToday:0,lastReset:Date.now()}); u.usedToday=0;}
 localStorage.setItem('cfb_sess',acct); afterLogin(u);
}
async function afterLogin(u){
 document.getElementById('authBox').classList.add('hidden'); goMenu('dashboard');
 document.getElementById('dashAcct').innerText=u.accountNumber; document.getElementById('dashBal').innerText='$'+Number(u.checking).toLocaleString()+'.00'; document.getElementById('dashCredit').innerText=u.creditScore;
 document.getElementById('dashLimit').innerText='$'+(u.dailyLimit||1000000).toLocaleString(); document.getElementById('dashUsed').innerText='$'+(u.usedToday||0).toLocaleString();
 let remain=(u.dailyLimit||1000000)-(u.usedToday||0); if(remain<0) remain=0; document.getElementById('dashRemain').innerText='$'+remain.toLocaleString(); document.getElementById('transferUsed').innerText='$'+(u.usedToday||0).toLocaleString(); document.getElementById('transferRemain').innerText='$'+remain.toLocaleString();
 let q=await db.collection('transfers').where('from','==',u.accountNumber).get(); let transfers=[]; q.forEach(d=>transfers.push(d.data())); let pend=transfers.filter(t=>t.status==='PENDING');
 document.getElementById('pendingCount').innerText=pend.length;
 document.getElementById('pendList').innerHTML=pend.reverse().map(t=>`<div class="py-3 flex justify-between"><div><b>$${Number(t.amount).toLocaleString()} → ${t.to}</b><div class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full inline-block font-bold mt-1">⏳ PENDING - ${t.ref}</div><div class="text-[10px] text-gray-400">${t.date}</div></div><button onclick="openReceipt('${t.id}')" class="text-[10px] bg-gray-100 px-3 py-1.5 rounded-full font-bold">Receipt</button></div>`).join('')||'<div class="text-gray-400 py-4 text-center">No pending ✓</div>';
 let txs=(u.transactions||[]).slice().reverse();
 document.getElementById('txPreview').innerHTML=txs.slice(0,3).map(t=>`<div class="py-3 flex justify-between"><div><div class="font-bold text-[12px]">${t.type}</div><div class="text-[10px] text-gray-400">${t.date}</div></div><div class="text-right"><div class="font-bold text-[12px]">${t.amount>0?'+':''}$${Number(t.amount).toLocaleString()}</div><div class="text-[9px] px-2 py-0.5 rounded-full ${t.status==='PENDING'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'} inline-block">${t.status}</div></div></div>`).join('')||'No activity';
 document.getElementById('txList').innerHTML=txs.map(t=>`<div class="py-3 flex justify-between"><div><div class="font-bold text-[12px]">${t.type} <span class="text-[9px] ${t.status==='PENDING'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'} px-2 py-0.5 rounded-full">${t.status}</span></div><div class="text-[10px] text-gray-400">${t.note} • ${t.date} • ${t.ref||''}</div></div><div><b>$${Number(t.amount).toLocaleString()}</b><br><button onclick="openReceipt('${t.transferId||''}')" class="text-[10px] underline text-blue-600">Receipt</button></div></div>`).join('')||'No history';
 currentUser=u;
}
document.getElementById('doTransferBtn').onclick=async()=>{
 const amt=parseFloat(document.getElementById('tAmount').value), to=document.getElementById('tTo').value.replace(/\D/g,'').trim(), toName=document.getElementById('tToName').value.trim(), pin=document.getElementById('tPin').value;
 let msg=document.getElementById('tMsg'); msg.classList.remove('hidden');
 if(!amt||!to) return msg.innerHTML='<span class=text-red-600>Fill all</span>', msg.className='text-xs p-3 rounded-xl bg-red-50 border';
 if(pin!==currentUser.pin) return msg.innerHTML='<span class=text-red-600>Wrong PIN</span>', msg.className='text-xs p-3 rounded-xl bg-red-50 border';
 const LIMIT=currentUser.dailyLimit||1000000; const used=currentUser.usedToday||0; const remain=LIMIT-used;
 if(used>=LIMIT){msg.className='text-xs p-3 rounded-xl bg-red-50 border border-red-200'; return msg.innerHTML=`⛔ <b>You have passed your daily limit of $${LIMIT.toLocaleString()}</b><br>Remaining $0`;}
 if(used+amt>LIMIT){msg.className='text-xs p-3 rounded-xl bg-red-50 border border-red-200'; return msg.innerHTML=`⛔ Limit! Remain $${remain.toLocaleString()} - You tried $${amt.toLocaleString()}`;}
 if(amt>currentUser.checking){msg.className='text-xs p-3 rounded-xl bg-red-50'; return msg.innerHTML='<span class=text-red-600>Insufficient</span>';}
 const id=Date.now().toString(); const refId='CFB'+Math.floor(100000000+Math.random()*900000000);
 const tr={id,from:currentUser.accountNumber,fromName:currentUser.name,to,toName,amount:amt,status:'PENDING',date:new Date().toLocaleString(),ref:refId};
 await db.collection('transfers').doc(id).set(tr);
 let newTx=[...(currentUser.transactions||[]), {type:'Transfer to '+to, amount:-amt, note:'To '+(toName||to), date:tr.date, status:'PENDING', transferId:id, ref:refId}];
 await db.collection('users').doc(currentUser.accountNumber).update({transactions:newTx});
 msg.className='text-xs p-3 rounded-xl bg-amber-50 border border-amber-200'; msg.innerHTML=`⏳ PENDING - Ref ${refId} - Waiting Admin`;
 let snap=await db.collection('users').doc(currentUser.accountNumber).get(); afterLogin(snap.data()); setTimeout(()=>openReceipt(id),600);
}
window.openReceipt=async(id)=>{
 let snap=await db.collection('transfers').doc(id).get(); let tr=snap.exists?snap.data():null; if(!tr){let f=currentUser.transactions.find(t=>t.transferId===id); if(!f) return alert('No receipt'); tr={id:f.transferId, amount:Math.abs(f.amount), to:f.note?.replace('To ','')||'', toName:f.note||'', date:f.date, status:f.status, ref:f.ref, from:currentUser.accountNumber, fromName:currentUser.name}}
 let color=tr.status==='SUCCESS'?'#16a34a':tr.status==='PENDING'?'#d97706':'#dc2626';
 let svg=`<svg viewBox="0 0 400 600" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="600" fill="white"/><rect x="0" y="0" width="400" height="72" fill="#0a2540"/><text x="62" y="30" fill="white" font-weight="800" font-size="14">CASHFLOWBANK</text><text x="62" y="46" fill="white" opacity="0.7" font-size="9">OFFICIAL RECEIPT - SVG</text><rect x="20" y="88" width="360" height="76" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="32" y="108" font-size="10" fill="#64748b">AMOUNT</text><text x="32" y="138" font-size="28" font-weight="800" fill="#0a2540">$${Number(tr.amount).toLocaleString()}.00</text><g transform="translate(285,105)"><rect width="85" height="32" rx="16" fill="${color}" opacity="0.12"/><text x="42" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${tr.status}</text></g><text x="20" y="220" font-size="11" fill="#94a3b8">Ref:</text><text x="125" y="220" font-family="monospace" font-weight="700">${tr.ref}</text><text x="20" y="238" font-size="11" fill="#94a3b8">Date:</text><text x="125" y="238">${tr.date}</text><text x="20" y="256" font-size="11" fill="#94a3b8">From:</text><text x="125" y="256">${tr.fromName} - ${tr.from}</text><text x="20" y="274" font-size="11" fill="#94a3b8">To:</text><text x="125" y="274">${tr.toName} - ${tr.to}</text><g transform="translate(240,450) rotate(-14)"><rect x="0" y="0" width="130" height="56" rx="8" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="7 4"/><text x="65" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="${color}">${tr.status==='SUCCESS'?'SUCCESSFUL':tr.status}</text></g></svg>`;
 document.getElementById('receiptSVGWrap').innerHTML=svg; document.getElementById('receiptModal').classList.remove('hidden');
}
window.onload=async()=>{let sess=localStorage.getItem('cfb_sess'); if(sess){let snap=await db.collection('users').doc(sess).get(); if(snap.exists) afterLogin(snap.data());}}
</script>
